[project]
name = "crosfit-training-backend"
version = "0.1.0"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "beanie>=2.2.0",
    "fastapi[standard]>=0.143.1",
    "httpx>=0.28.1",
    "python-jose[cryptography]>=3.5.0",
    "ruff>=0.17.0",
    "uvicorn[standard]>=0.54.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
